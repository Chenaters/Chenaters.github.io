projects:
  - number: "01"
    title: Jack, with yield
    category: Compiler design · IMSA capstone
    description: Extended the Jack language with cooperative coroutines, yield, and finish. The compiler turns resumable tasks into Hack VM state machines, with original demos and documented language limits.
    tags:
      - Python
      - Compiler design
      - Hack VM
    note: A self-made language extension built on my computer systems coursework.
    links:
      - label: Explore the extension
        url: https://github.com/Chenaters/imsa-computer-systems/tree/main/jack-coroutines
      - label: Systems collection
        url: https://github.com/Chenaters/imsa-computer-systems
  - number: "02"
    title: Deep learning experiments
    category: Machine learning · computer vision
    description: A source collection spanning vision transformers, CNNs, autoencoders, neural NLP, and synthetic anomaly detection. Includes CSIRO pasture biomass experiments using CNN baselines and a small DINO regressor.
    tags:
      - PyTorch
      - TensorFlow
      - Computer vision
    note: Exploratory projects with setup instructions and per-project validation notes.
    links:
      - label: Browse the collection
        url: https://github.com/Chenaters/deep-learning-projects
      - label: CSIRO biomass
        url: https://github.com/Chenaters/deep-learning-projects/tree/main/projects/csiro-biomass-experiments
      - label: MRI DINOv3 baseline
        url: https://github.com/Chenaters/deep-learning-projects/tree/main/projects/rsna-knee-dinov3-baseline
  - number: "03"
    title: pmsesampling
    category: Open-source research software
    description: Analytic and simulation tools that estimate the sample size needed to reach a target prediction error in linear regression. Co-authored, documented, and published on CRAN.
    tags:
      - R
      - Simulation
      - Statistical computing
    links:
      - label: View on CRAN
        url: https://cran.r-project.org/web/packages/pmsesampling/index.html
      - label: Source code
        url: https://github.com/Chenaters/pmsesampling
  - number: "04"
    title: PDF Bookmarks for ONLYOFFICE
    category: Developer tools · editor extension
    description: An offline bookmark panel for the ONLYOFFICE PDF editor. Stores named page markers locally for each document, follows the editor theme, and keeps the PDF itself unchanged.
    tags:
      - JavaScript
      - Local storage
      - Plugin development
    links:
      - label: Source and installation
        url: https://github.com/Chenaters/onlyoffice-pdf-bookmarks
  - number: "05"
    title: Plant identification models
    category: Computer vision research
    description: Implemented and evaluated MATLAB computer-vision models for plant identification, then analyzed experimental results to improve model performance and workflow reliability.
    tags:
