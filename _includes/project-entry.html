<article class="project-entry">
<h3>{{ project.title }}</h3>
<p class="meta">{{ project.category }}{% if project.context %} · {{ project.context }}{% endif %}</p>
<p>{{ project.description }}</p>
{% if project.note %}<p class="note">{{ project.note }}</p>{% endif %}
{% if project.links %}<ul class="project-links" aria-label="{{ project.title | escape }} links">{% for link in project.links %}<li><a href="{{ link.url }}">{{ link.label }} ↗</a></li>{% endfor %}</ul>{% endif %}
</article>
